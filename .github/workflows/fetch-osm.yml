# Fetches Jersey's OpenStreetMap data into data/osm and commits it to the branch that
# triggered it. Runs on push when this file or the fetch script changes, or by hand.
name: Fetch OSM data
on:
  push:
    branches-ignore: [claude/zen-faraday-0sj5n7]
    paths: [.github/workflows/fetch-osm.yml, scripts/osm/queries.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: scripts/osm/queries.sh data/osm
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -m "Map data: OpenStreetMap extract for Jersey (© OpenStreetMap contributors)" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
